<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dressky</title>
<style>
:root{--bg:#0b0b0c;--fg:#f4f4f5;--mute:#8a8a90;--line:#232326;--card:#131315;--acc:#c4b5fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f6f4;--fg:#0b0b0c;--mute:#6b6b72;--line:#dcdcd8;--card:#fff;--acc:#6d4ce0}}
:root[data-theme="light"]{--bg:#f6f6f4;--fg:#0b0b0c;--mute:#6b6b72;--line:#dcdcd8;--card:#fff;--acc:#6d4ce0}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow-x:hidden;
background-image:radial-gradient(600px 400px at 50% 38%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 70%)}
.marquee{border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;font:12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);padding:14px 0;letter-spacing:.08em;text-transform:uppercase}
.track{display:inline-block;animation:m 28s linear infinite}
.track span{margin:0 22px}
@keyframes m{to{transform:translateX(-50%)}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px;gap:36px}
.tag{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}
.tag b{color:var(--acc);font-weight:500}
h1{font-size:clamp(52px,17vw,128px);line-height:.95;letter-spacing:-.05em;font-weight:700}
.links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.links a{width:84px;height:84px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg);transition:transform .2s,border-color .2s,box-shadow .2s}
.links a svg{width:30px;height:30px;stroke-width:1.6;color:var(--acc)}
.links a small{font:10px ui-monospace,Menlo,Consolas,monospace;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.links a:hover,.links a:focus-visible{transform:translateY(-5px);border-color:var(--acc);box-shadow:0 10px 30px -10px var(--acc);outline:none}
footer{border-top:1px solid var(--line);padding:22px 20px;text-align:center;font-size:14px;color:var(--mute)}
footer a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--acc);padding-bottom:1px;margin-left:6px}
footer a:hover{color:var(--acc)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <div>
    <h1>dressky</h1>
  </div>
  <nav class="links">
    <a href="https://t.me/dressky" target="_blank" rel="noopener"><i data-lucide="send"></i><small>Telegram</small></a>
    <a href="https://gitlab.com/dressky" target="_blank" rel="noopener"><i data-lucide="gitlab"></i><small>GitLab</small></a>
    <a href="https://twitch.tv/dressky" target="_blank" rel="noopener"><i data-lucide="twitch"></i><small>Twitch</small></a>
    <a href="https://steamcommunity.com/id/dressky" target="_blank" rel="noopener"><i data-lucide="gamepad-2"></i><small>Steam</small></a>
  </nav>
</main>
<footer>contact me <a href="mailto:dressky@proton.me">dressky@proton.me</a></footer>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
try{lucide.createIcons()}catch(e){}
(function(){
var c=document.getElementById("bg"),x=c.getContext("2d"),S=14,G=2,W,H,cols,rows,ph=[],mx=-999,my=-999,rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
function col(){var t=document.documentElement.getAttribute("data-theme");var l=t==="light"||(t!=="dark"&&matchMedia("(prefers-color-scheme:light)").matches);return l?"20,20,24":"230,225,255"}
function size(){var d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);cols=Math.ceil(W/S);rows=Math.ceil(H/S);ph=[];for(var i=0;i<cols*rows;i++)ph.push([Math.random()*6.28,.4+Math.random()*1.2]);if(rm)draw(0)}
function draw(t){x.clearRect(0,0,W,H);var rgb=col(),s=S-G;t/=1000;
for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){var p=ph[j*cols+i],a=.04+.1*(.5+.5*Math.sin(t*p[1]+p[0]));
var dx=i*S+S/2-mx,dy=j*S+S/2-my,d=Math.sqrt(dx*dx+dy*dy);if(d<160){var k=1-d/160;a+=.8*k*k}
x.fillStyle="rgba("+rgb+","+Math.min(a,1)+")";x.fillRect(i*S,j*S,s,s)}
if(!rm)requestAnimationFrame(draw)}
size();addEventListener("resize",size);
addEventListener("pointermove",function(e){mx=e.clientX;my=e.clientY});
if(!rm)requestAnimationFrame(draw);
})();
</script>
</body>
</html>
